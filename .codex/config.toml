# Codex user config (~/.codex/config.toml)
#
# This is the *portable, user-owned* baseline only: model prefs + my own MCP
# servers (ported from ~/.config/opencode/opencode.jsonc).
#
# Deliberately EXCLUDED because the ChatGPT desktop app owns/regenerates them and
# they are machine-specific (absolute paths, timestamps, per-path trust):
#   - notify (path into ChatGPT.app)
#   - [projects."..."] trust_level
#   - [tui.model_availability_nux], [marketplaces.*], [plugins.*], [desktop]
#   - [mcp_servers.node_repl], [mcp_servers.computer-use] (bundled by the app)
#
# WARNING: the desktop app rewrites this file. If you symlink it, the app may
# write its managed keys *through* the symlink (polluting this tracked file with
# machine-specific churn) or replace the symlink with a regular file. Verify
# before relying on it. See README.md.

model = "gpt-5.5"
model_reasoning_effort = "medium"

# --- MCP servers (ported from opencode.jsonc) ---

[mcp_servers.cf-portal]
url = "https://portal.mcp.cfdata.org/mcp"
enabled = true

[mcp_servers.grep_app]
url = "https://mcp.grep.app"
enabled = true

[mcp_servers.chrome-devtools]
command = "bunx"
args = ["-y", "chrome-devtools-mcp@latest"]
enabled = false

[mcp_servers.cloudflare-builds]
url = "https://builds.mcp.cloudflare.com/mcp"
auth = "oauth"
enabled = false

[mcp_servers.cloudflare-observability]
url = "https://observability.mcp.cloudflare.com/mcp"
auth = "oauth"
enabled = false
